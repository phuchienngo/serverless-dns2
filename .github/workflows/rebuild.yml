# Builds the blocklist and deploys the Worker: on every push to main, and every
# day so the lists stay current. If a source fails, the build fails before the
# deploy and the previous version keeps serving.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 20 * * *' # 03:17 in Vietnam (UTC+7)
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - run: bun run build-lists
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
