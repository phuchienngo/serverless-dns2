# One job: tests, then builds the blocklist and deploys the Worker, on every
# push to main and every day so the lists stay current. A failing test stops
# the build; a failing source stops the deploy. Either way the previous version
# keeps serving.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 20 * * *' # 03:17 in Vietnam (UTC+7)
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Build the blocklist
        run: bun run build-lists
      - name: Smoke test Worker
        run: bun test --timeout 20000 ./test/worker.smoke.ts
        timeout-minutes: 1
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
